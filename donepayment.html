<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBO - Payment Successful</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ===================== CSS BERSAMA ===================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color: #000;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul,
    ol {
      list-style: none;
    }

    button {
      font-family: inherit;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
    }

    [hidden] {
      display: none !important;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .placeholder {
      background-color: #d9d9d9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b3b3b3;
    }

    /* tombol abu-abu panjang (Check the payment status / Done) */
    .btn-main {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background: #999;
      color: #fff;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-main:hover {
      background: #777;
    }

    .btn-main:disabled {
      background: #c9c9c9;
      cursor: not-allowed;
    }

    /* ===================== CSS KHUSUS HALAMAN INI ===================== */
    .status {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 0;
    }

    .status-head {
      text-align: center;
      padding-bottom: 26px;
    }

    .status-head h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .order-label {
      margin-top: 8px;
      font-size: 17px;
      font-weight: 500;
      color: #999;
    }

    .order-id {
      font-size: 17px;
      font-weight: 700;
      color: #999;
      word-break: break-all;
    }

    .status-body {
      text-align: center;
      padding: 44px 0 40px;
    }

    .status-text {
      font-size: 20px;
      line-height: 1.5;
    }

    .status-text strong {
      display: block;
      margin-top: 6px;
      font-weight: 800;
    }

    @media (min-width: 1024px) {
      .status-head h1 {
        font-size: 36px;
      }

      .order-label,
      .order-id {
        font-size: 28px;
      }

      .status-body {
        padding: 70px 0 60px;
      }

      .status-text {
        font-size: 32px;
      }

      .btn-main {
        padding: 22px 20px;
        font-size: 24px;
      }
    }

    .order-line {
      margin-top: 8px;
      font-size: 17px;
      font-weight: 500;
      color: #999;
    }

    .order-line strong {
      margin-left: 8px;
      font-weight: 700;
      color: #222;
      word-break: break-all;
    }

    .success-icon {
      width: 150px;
      height: 130px;
      margin: 0 auto 36px;
    }

    @media (min-width: 1024px) {
      .order-line {
        font-size: 28px;
      }

      .success-icon {
        width: 380px;
        height: 330px;
        margin-bottom: 60px;
      }
    }

    /* ---------- confetti & animasi ikon ---------- */
    .confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    .success-btn {
      display: block;
      margin: 0 auto 36px;
      border-radius: 50%;
    }

    .success-btn .success-icon {
      display: block;
      margin: 0;
      transition: transform 0.2s;
    }

    .circle-anim {
      transform-box: fill-box;
      transform-origin: center;
      animation: muncul 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .check-anim {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: gambar 0.55s 0.45s ease-out forwards;
    }

    @keyframes muncul {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }

    @keyframes gambar {
      to {
        stroke-dashoffset: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .circle-anim,
      .check-anim {
        animation: none;
        stroke-dashoffset: 0;
      }
    }

    @media (min-width: 1024px) {
      .success-btn {
        margin-bottom: 60px;
      }

      // ---------- confetti ----------
    // tanpa library: partikel digambar di <canvas> lalu berhenti sendiri setelah semuanya jatuh
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    const kurangiGerak = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const warna = ['#ff4d6d', '#ffb703', '#06d6a0', '#118ab2', '#9b5de5', '#f15bb5', '#fee440'];
    let partikel = [];
    let animasi = null;

    function ukuranCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    ukuranCanvas();
    window.addEventListener('resize', ukuranCanvas);

    function acak(min, max) {
      return Math.random() * (max - min) + min;
    }

    // semburan dari titik (x, y); arah dalam derajat (-90 = ke atas), sebaran = lebar semburan
    function semburan(x, y, jumlah, arah, sebaran, kekuatan) {
      for (let i = 0; i < jumlah; i++) {
        const sudut = (arah + acak(-sebaran / 2, sebaran / 2)) * Math.PI / 180;
        const laju = acak(0.4, 1) * kekuatan;
        partikel.push({
          x: x,
          y: y,
          vx: Math.cos(sudut) * laju,
          vy: Math.sin(sudut) * laju,
          lebar: acak(6, 11),
          tinggi: acak(4, 7),
          bulat: Math.random() < 0.25,
          warna: warna[Math.floor(Math.random() * warna.length)],
          putar: acak(0, Math.PI * 2),
          lajuPutar: acak(-0.3, 0.3),
          goyang: acak(0, Math.PI * 2),
          umur: 0,
          masaHidup: acak(110, 190)
        });
      }
      if (!animasi) animasi = requestAnimationFrame(gambarFrame);
    }

    function gambarFrame() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      partikel = partikel.filter(function (p) {
        p.umur++;
        p.vx *= 0.985;
        p.vy = p.vy * 0.985 + 0.22;          // gravitasi
        p.x += p.vx + Math.sin(p.goyang + p.umur * 0.1) * 0.6;
        p.y += p.vy;
        p.putar += p.lajuPutar;

        const sisa = 1 - p.umur / p.masaHidup;
        if (sisa <= 0 || p.y > window.innerHeight + 30) return false;

        ctx.save();
        ctx.globalAlpha = Math.min(1, sisa * 2);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.putar);
        ctx.fillStyle = p.warna;
        if (p.bulat) {
          ctx.beginPath();
          ctx.arc(0, 0, p.tinggi / 1.4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.lebar / 2, -p.tinggi / 2, p.lebar, p.tinggi);
        }
        ctx.restore();
        return true;
      });

      animasi = partikel.length ? requestAnimationFrame(gambarFrame) : null;
    }

    // pesta besar: dari dua sudut bawah + hujan dari atas
    function pesta() {
      if (kurangiGerak) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      const kuat = Math.max(14, Math.min(24, h / 36));

      semburan(0, h, 70, -60, 50, kuat);
      semburan(w, h, 70, -120, 50, kuat);

      setTimeout(function () {
        for (let i = 0; i < 6; i++) {
          semburan(acak(0.1, 0.9) * w, -10, 12, 90, 70, 5);
        }
      }, 350);
    }

    // confetti langsung meledak begitu halaman terbuka
    pesta();

    // ---------- Done: hapus data pesanan, lalu kembali ke BBO Events ----------
    document.getElementById('btnDone').addEventListener('click', function () {
      sessionStorage.removeItem('bbo_order');
      sessionStorage.removeItem('bbo_deadline');
    });
  </script>

</body>
</html>
